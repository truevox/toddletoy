<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4CAF50">
    <meta name="description"
        content="Montessori-aligned interactive toddler toy with bilingual speech, audio tones, and visual effects">
    <meta name="keywords" content="toddler, education, montessori, bilingual, interactive, learning">
    <meta name="author" content="Marvin Bentley II">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="apple-mobile-web-app-title" content="ToddleToy">
    <meta name="msapplication-TileColor" content="#4CAF50">

    <title>ToddleToy - Interactive Learning</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <style>
        @font-face {
            font-family: 'Kaktovik';
            src: url('./fonts/GentiumKaktovik.ttf') format('truetype');
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            background: #095060; /* matches the sandbox backdrop (BACKDROP_BASE_COLOR) */
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #game-container canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            pointer-events: auto !important;
            z-index: 10;
        }

        /* Mobile-specific optimizations */
        @media screen and (max-width: 768px) {
            body {
                -webkit-text-size-adjust: none;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }

            #game-container {
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            }
        }

        /* Orientation handling */
        @media screen and (orientation: landscape) and (max-height: 500px) {
            #game-container {
                height: 100vh;
            }
        }
    </style>
</head>

<body>
    <div id="game-container"></div>
    <script type="module" src="src/main.js"></script>
</body>

</html>
